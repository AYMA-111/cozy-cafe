<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Café - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">☕ Cozy Café</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="menu.html">Menu</a>
            <a class="nav-link" href="about.html">About</a>
            <a class="nav-link active" href="contact.html">Contact</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h1 class="text-center mb-5">Contact Us</h1>
    <div class="row">
        <div class="col-md-6">
            <h3>Get In Touch</h3>
            <p><strong>📍 Address:</strong> Main Road, Karachi</p>
            <p><strong>📞 Phone:</strong> 0300-1234567</p>
            <p><strong>📧 Email:</strong> cozycafe@gmail.com</p>
            <p><strong>🕐 Opening Hours:</strong> 9:00 AM - 11:00 PM</p>
        </div>
        <div class="col-md-6">
            <form>
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" placeholder="Enter your name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="Enter your email">
                </div>
                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea class="form-control" rows="5" placeholder="Write your message"></textarea>
                </div>
                <button type="submit" class="btn btn-warning">Send Message</button>
            </form>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">© 2026 Cozy Café | All Rights Reserved</p>
</footer>
</body>
</html>
